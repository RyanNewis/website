<!doctype html>
<html>
<head>
<style>
  body { font-family: sans-serif; background: #fff; margin: 20px; }
  .row { display: flex; gap: 30px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 40px; }
  h2 { font-size: 14px; margin: 0 0 8px; color: #444; }
  figure { margin: 0; text-align: center; }
  img { height: 130px; display: block; margin: auto; }
  .roundels img { height: 180px; }
  figcaption { font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<h2>Reference</h2>
<div class="row">
    <figure><img src="ecosounds.svg"><figcaption>original</figcaption></figure>
    <figure><img src="ecosounds-logo.svg"><figcaption>current (disliked)</figcaption></figure>

</div>
<h2>Waveform marks</h2>
<div class="row">
  <figure><img src="ecosounds-logo-v1-bird-waveform.svg"><figcaption>v1 bird-waveform (traced)</figcaption></figure>
  <figure><img src="ecosounds-logo-v2-sampled-bird.svg"><figcaption>v2 sampled bird</figcaption></figure>
</div>
<h2>Annotation style</h2>
<div class="row">
  <figure><img src="ecosounds-logo-v13-annotated-call.svg"><figcaption>v13 annotated call</figcaption></figure>
  <figure><img src="ecosounds-logo-v16-annotated-samples.svg"><figcaption>v16 annotated samples</figcaption></figure>
  <figure><img src="ecosounds-logo-v18-annotated-samples.svg"><figcaption>v18 annotated samples (no bird)</figcaption></figure>
 </div>
 <div class="row">
  <figure><img src="ecosounds-logo-v19-negative-annotation.svg"><figcaption>v19 negative annotation</figcaption></figure>
  <figure><img src="ecosounds-logo-v20-negative-annotation.svg"><figcaption>v20 negative annotation (no bird)</figcaption></figure>
  <figure><img src="ecosounds-logo-v21-regular-annotation.svg"><figcaption>v21 regular annotation</figcaption></figure>
  <figure><img src="ecosounds-logo-v25-regular-annotation-tight.svg"><figcaption>v25 regular annotation (no context)</figcaption></figure>
  <figure><img src="ecosounds-logo-v24-negative-square.svg" style="height:170px"><figcaption>v24 negative square</figcaption></figure>
  <figure><img src="ecosounds-logo-v26-negative-square-tall.svg" style="height:170px"><figcaption>v26 negative square (tall)</figcaption></figure>
</div>
<h2>Roundels — bird &amp; diamond</h2>
<div class="row roundels">
  <figure><img src="ecosounds-logo-v5-roundel.svg"><figcaption>v5 roundel</figcaption></figure>
  <figure><img src="ecosounds-logo-v9-songbird-roundel.svg"><figcaption>v9 songbird roundel</figcaption></figure>
  <figure><img src="ecosounds-logo-v15-diamond-roundel-bird.svg"><figcaption>v15 diamond roundel + bird</figcaption></figure>
  <figure><img src="ecosounds-logo-v17-diamond-roundel.svg"><figcaption>v17 diamond roundel (no bird)</figcaption></figure>
  <figure><img src="ecosounds-logo-v22-diamond-roundel-organic.svg"><figcaption>v22 diamond roundel (organic)</figcaption></figure>
</div>
<h2>Roundels — earth</h2>
<div class="row roundels">
  <figure><img src="ecosounds-logo-v11-earth-roundel.svg"><figcaption>v11 earth roundel</figcaption></figure>
  <figure><img src="ecosounds-logo-v12-earth-roundel-bold.svg"><figcaption>v12 earth roundel (bold)</figcaption></figure>
</div>
<h2>Database shapes</h2>
<div class="row">
            <figure><img src="ecosounds-logo-v27-database-cylinder.svg" style="height:170px">
                <figcaption>v27 database cylinder</figcaption>
            </figure>
            <figure><img src="ecosounds-logo-v30-database-ingest.svg" style="height:170px">
                <figcaption>v30 database ingest</figcaption>
            </figure>

            </figure>
            <figure><img src="ecosounds-logo-v32-database-wrap.svg" style="height:170px">
                <figcaption>v32 database wrap</figcaption>

        <div class="row">
            <figure><img src="ecosounds-logo-v37.svg" style="height:250px">
                <figcaption>v37 database with circle logo</figcaption>
            </figure>
        </div>
        <h2>Alternative waveform - traced from a whip bird reference call on ecosounds</h2>
        <div class="row">
            <figure><img src="ecosounds-logo-v33.svg" style="height:250px">
                <figcaption>v33 whip bird waveform, square</figcaption>
            </figure>
            <figure><img src="ecosounds-logo-v34.svg" style="height:250px">

            </figure>

                <figcaption>v35 whip bird waveform (with bird)</figcaption>
            </figure>
            <figure><img src="ecosounds-logo-v36.svg" style="height:250px">
                <figcaption>v36 database with waveform icon</figcaption>
            </figure>
        </div>
        <h2>Bird + whale idea</h2>
        <div class="row">
            <figure><img src="ecosounds-logo-v38.svg" style="height:250px">
                <figcaption>v38 bird + whale</figcaption>
            </figure>
            <figure><img src="ecosounds-logo-v39.svg" style="height:250px">
                <figcaption>v39 bird + whale (no circle)</figcaption>
            </figure>
</div>
<h2>Other</h2>
<div class="row">
  <figure><img src="ecosounds-logo-v23-wordmark.svg" style="height:80px"><figcaption>v23 wordmark</figcaption></figure>
  <figure><img src="ecosounds-logo-v8-sound-bloom.svg"><figcaption>v8 sound bloom</figcaption></figure>
</div>

</html>
