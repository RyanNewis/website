<!-- Ecosounds logo variant: right half of the original waveform with a
     labelled annotation box spanning the central peak, from local minimum
     to local minimum. -->
<svg id="ecosounds-logo-annotation-samples" data-name="v16 annotated samples" xmlns="http://www.w3.org/2000/svg" viewBox="52.5 -8 71 67">
  <defs>
    <style>
      #ecosounds-logo-annotation-samples .cls-1 {
        fill: var(--ecosounds-logo-bird-color, #231f20);
      }

      #ecosounds-logo-annotation-samples .cls-2 {
        fill: var(--ecosounds-logo-wave-color, #666);
      }

      #ecosounds-logo-annotation-samples .box {
        fill: none;
        stroke: var(--ecosounds-logo-accent-color, #00467f);
        stroke-width: 1.6;
      }

      #ecosounds-logo-annotation-samples .label {
        fill: var(--ecosounds-logo-accent-color, #00467f);
      }
    </style>
  </defs>
  <!-- right half of the original samples -->
  <g class="cls-2">
