    <rect x="117.41" y="25.01" width="3.78" height="14.64" rx="1.89"/>
  </g>
  <!-- bird beside the label, centred over the space to the box's right edge -->
  <path class="cls-1" transform="translate(50.36 -2.24) scale(0.65)" d="M82.17,1.17c-3.14-1.17-7.45-1.84-10.1-.15-2.43,1.55-3.35,4.25-3.69,5.86-1.79-.81-5.04-1.87-7.97-.59-2.57,1.09-4.24,3.65-5,7.67l-.17,1.03.49-.88c1.72-2.96,3.35-4.94,5.51-5.89,3.22-1.4,7.36,1.14,7.41,1.17l1.51.96.09-1.78s.26-4.04,2.96-5.77c1.87-1.19,4.36-1.55,8.89-1.29l1.25.13-1.19-.47Z"/>
