<!-- Ecosounds logo variant: labelled annotation box over the waveform's
     central peak, no bird. -->
<svg id="ecosounds-logo-annotation-samples-plain" data-name="v18 annotated samples (no bird)" xmlns="http://www.w3.org/2000/svg" viewBox="52.5 1 71 58">
  <defs>
    <style>
      #ecosounds-logo-annotation-samples-plain .cls-2 {
        fill: var(--ecosounds-logo-wave-color, #666);
      }

      #ecosounds-logo-annotation-samples-plain .box {
        fill: none;
        stroke: var(--ecosounds-logo-accent-color, #00467f);
        stroke-width: 1.6;
      }

      #ecosounds-logo-annotation-samples-plain .label {
        fill: var(--ecosounds-logo-accent-color, #00467f);
      }
    </style>
  </defs>
  <!-- right half of the original samples -->
  <g class="cls-2">
    <rect x="54.41" y="27.27" width="3.78" height="10.11" rx="1.89"/>
    <rect x="61.41" y="29.48" width="3.78" height="5.7" rx="1.89"/>
    <rect x="68.41" y="26.33" width="3.78" height="11.99" rx="1.89"/>
    <rect x="75.41" y="20.96" width="3.78" height="22.74" rx="1.89"/>
    <rect x="82.41" y="13.7" width="3.78" height="37.27" rx="1.89"/>
    <rect x="89.41" y="9.86" width="3.78" height="44.92" rx="1.89"/>
    <rect x="96.41" y="18.3" width="3.78" height="28.07" rx="1.89"/>
    <rect x="103.41" y="23.04" width="3.78" height="18.58" rx="1.89"/>
    <rect x="110.41" y="27.94" width="3.78" height="8.79" rx="1.89"/>
    <rect x="117.41" y="25.01" width="3.78" height="14.64" rx="1.89"/>
  </g>
  <!-- label sits flush on the border: flat left edge, rounded top only -->
  <path class="label" d="M66,8.4v-4.4a1,1 0 0 1 1,-1h14a1,1 0 0 1 1,1v4.4Z"/>
  <!-- box borders centred in the gaps between selected and context samples;
       top-left corner square where the label sits -->
  <path class="box" d="M66.8,8.4H106.3A2.5,2.5 0 0 1 108.8,10.9V53.5A2.5,2.5 0 0 1 106.3,56H69.3A2.5,2.5 0 0 1 66.8,53.5Z"/>
