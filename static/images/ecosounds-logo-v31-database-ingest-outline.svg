    <style>
      #ecosounds-logo-database-ingest-outline .cls-2 {
        fill: var(--ecosounds-logo-wave-color, #666);
      }

      #ecosounds-logo-database-ingest-outline .jar {
        fill: none;
        stroke: var(--ecosounds-logo-accent-color, #00467f);
        stroke-width: 3;
