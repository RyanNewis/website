<!-- Ecosounds roundel variant: Australia as bold, chunky waveform samples.
     Same world.geo.json AUS outline as the fine variant, coarser grid. -->
<svg id="ecosounds-logo-circle-earth-bold" data-name="v12 earth roundel (bold)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <defs>
    <style>
      #ecosounds-logo-circle-earth-bold .ocean {
        fill: var(--ecosounds-logo-accent-color, #00467f);
      }

      #ecosounds-logo-circle-earth-bold .bar {
        fill: var(--ecosounds-logo-roundel-wave-color, #ffffff);
      }
    </style>
  </defs>
  <circle class="ocean" cx="36" cy="36" r="36"/>
  <g transform="translate(10.2 10) scale(0.57)">
